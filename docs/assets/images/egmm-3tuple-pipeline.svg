<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4ade80"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="480" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="34" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">e-GMM Architecture: 3-Tuple EMA Sufficient Statistics &amp; Spectral Revival</text>
  <text x="490" y="54" text-anchor="middle" fill="#94a3b8" font-size="11.5">Scaling Soft Gaussian Mixture Expectation-Maximization via Ratio Readout, Covariance Floor, and Dimension-Aware Schedules</text>

  <!-- Box 1: Init & Schedule -->
  <rect x="26" y="74" width="215" height="175" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="133" y="97" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. Init &amp; d-Aware Schedule</text>
  <text x="38" y="120" fill="#e2e8f0" font-size="10.5">N_j(0) = 1e-10</text>
  <text x="38" y="138" fill="#e2e8f0" font-size="10.5">S_j(0) = N_j * mu_j^(0)</text>
  <text x="38" y="156" fill="#e2e8f0" font-size="10.5">Q_j(0) = N_j(sigma_0^2 I + mu mu^T)</text>
  <rect x="38" y="170" width="191" height="64" rx="6" fill="#0f172a" stroke="#1e40af"/>
  <text x="133" y="189" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="700">d-Aware Scaling Law</text>
  <text x="133" y="206" text-anchor="middle" fill="#e2e8f0" font-size="9.8" font-family="Consolas, monospace">a0 = C k^ak B^aB n^an T^aT d^ad</text>
  <text x="133" y="223" text-anchor="middle" fill="#94a3b8" font-size="9.5">Cosine floor eps = 0.1</text>

  <line x1="243" y1="160" x2="273" y2="160" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- Box 2: Fused Log-Space E-Step -->
  <rect x="275" y="74" width="225" height="175" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="387" y="97" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">2. Flash-GMM Log-Space E-Step</text>
  <text x="289" y="120" fill="#e2e8f0" font-size="10.5">Mini-batch B in BF16 / FP32</text>
  <text x="289" y="139" fill="#cbd5e1" font-size="10">Diag: 2d-aug GEMM + c_j</text>
  <text x="289" y="157" fill="#cbd5e1" font-size="10">Low-Rank: Woodbury + Det Lemma</text>
  <text x="289" y="175" fill="#cbd5e1" font-size="10">Full: Cholesky L_j solve</text>
  <rect x="289" y="188" width="197" height="46" rx="6" fill="#0f172a" stroke="#4f46e5"/>
  <text x="387" y="206" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700">Streaming LogSumExp + Top-m</text>
  <text x="387" y="223" text-anchor="middle" fill="#94a3b8" font-size="9.5">r_ij = softmax(log pi_j + log N)</text>

  <line x1="502" y1="160" x2="532" y2="160" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- Box 3: 3-Tuple FP32 EMA Update -->
  <rect x="534" y="74" width="215" height="175" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="641" y="97" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">3. 3-Tuple FP32 EMA Update</text>
  <rect x="546" y="110" width="191" height="84" rx="6" fill="#0f172a"/>
  <text x="556" y="130" fill="#e2e8f0" font-size="10.2" font-family="Consolas, monospace">N_j &lt;- g N_j + (1-g) sum r_ij</text>
  <text x="556" y="151" fill="#e2e8f0" font-size="10.2" font-family="Consolas, monospace">S_j &lt;- g S_j + (1-g) sum r_ij x_i</text>
  <text x="556" y="172" fill="#4ade80" font-size="10.2" font-family="Consolas, monospace" font-weight="700">Q_j &lt;- g Q_j + (1-g) sum r_ij x x^T</text>
  <text x="641" y="213" text-anchor="middle" fill="#94a3b8" font-size="9.8">Optional Slow-EMA shadow</text>
  <text x="641" y="230" text-anchor="middle" fill="#86efac" font-size="9.8">(N^slow, S^slow, Q^slow) for Test NLL</text>

  <line x1="751" y1="160" x2="781" y2="160" stroke="#4ade80" stroke-width="2.2" marker-end="url(#arrGreen)"/>

  <!-- Box 4: Regularized Ratio Readout -->
  <rect x="783" y="74" width="172" height="175" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="869" y="97" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">4. Ratio Readout</text>
  <rect x="794" y="110" width="150" height="92" rx="6" fill="#0f172a"/>
  <text x="802" y="132" fill="#e2e8f0" font-size="10.2">pi_j = N_j / sum N_l</text>
  <text x="802" y="154" fill="#e2e8f0" font-size="10.2">mu_j = S_j / N_j</text>
  <text x="802" y="176" fill="#fbbf24" font-size="10" font-weight="700">Sigma_j = Q_j/N_j</text>
  <text x="814" y="192" fill="#fbbf24" font-size="10" font-weight="700">- mu mu^T + lam0 I</text>
  <text x="869" y="220" text-anchor="middle" fill="#fde68a" font-size="9.5" font-weight="700">Strict PSD Guarantee:</text>
  <text x="869" y="234" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Sigma_j &gt;= lambda_0 I &gt; 0</text>

  <!-- Bottom Left: Spectral Splitting -->
  <rect x="26" y="274" width="600" height="180" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.8"/>
  <text x="326" y="298" text-anchor="middle" fill="#4ade80" font-size="13.5" font-weight="700">5. Spectral Component Splitting (Every 5 Batches: N_j &lt; tau * mean(N))</text>

  <ellipse cx="145" cy="370" rx="85" ry="26" transform="rotate(-14 145 370)" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.8"/>
  <line x1="68" y1="390" x2="222" y2="350" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="145" cy="370" r="4.5" fill="#f8fafc"/>
  <text x="145" y="422" text-anchor="middle" fill="#cbd5e1" font-size="10">Donor j* (principal axis v_1, lam_max)</text>

  <line x1="242" y1="370" x2="294" y2="370" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrAmber)"/>
  <text x="268" y="357" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">Split</text>

  <ellipse cx="362" cy="382" rx="40" ry="23" transform="rotate(-14 362 382)" fill="#4ade80" fill-opacity="0.20" stroke="#4ade80" stroke-width="1.8"/>
  <ellipse cx="436" cy="356" rx="40" ry="23" transform="rotate(-14 436 356)" fill="#f472b6" fill-opacity="0.20" stroke="#f472b6" stroke-width="1.8"/>
  <circle cx="362" cy="382" r="4" fill="#4ade80" stroke="#fff"/>
  <circle cx="436" cy="356" r="4" fill="#f472b6" stroke="#fff"/>
  <text x="400" y="422" text-anchor="middle" fill="#cbd5e1" font-size="10">Child +/- along v_1</text>

  <rect x="488" y="314" width="124" height="122" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="550" y="334" text-anchor="middle" fill="#e2e8f0" font-size="9.8" font-weight="700">Consistent Update</text>
  <text x="496" y="354" fill="#86efac" font-size="9.3">mu+/- = mu +/- d*s*v1</text>
  <text x="496" y="372" fill="#e2e8f0" font-size="9.3">N_child = N_j* / 2</text>
  <text x="496" y="390" fill="#e2e8f0" font-size="9.3">Shrink lam_1*(1-d^2)</text>
  <text x="496" y="408" fill="#fbbf24" font-size="9.3">Q = N(Cov + mu mu^T)</text>
  <text x="496" y="426" fill="#94a3b8" font-size="9">5x power iter (full)</text>

  <!-- Bottom Right: Dual Finalization -->
  <rect x="646" y="274" width="309" height="180" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="800" y="298" text-anchor="middle" fill="#c4b5fd" font-size="13.5" font-weight="700">6. Zero-Overhead Dual Finalization</text>
  <rect x="662" y="314" width="277" height="58" rx="6" fill="#0f172a" stroke="#6366f1"/>
  <text x="674" y="333" fill="#93c5fd" font-size="10.5" font-weight="700">A. Last-Epoch Exact EM (Train NLL)</text>
  <text x="674" y="352" fill="#cbd5e1" font-size="9.8">Accumulate final epoch r_ij directly -&gt; exact M-step</text>
  <rect x="662" y="382" width="277" height="58" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="674" y="401" fill="#6ee7b7" font-size="10.5" font-weight="700">B. Slow-EMA Shadow (Test NLL / OOD)</text>
  <text x="674" y="420" fill="#cbd5e1" font-size="9.8">Passive (N^slow, S^slow, Q^slow) reduces overfitting</text>
</svg>
