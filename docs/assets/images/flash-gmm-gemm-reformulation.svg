<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrMint" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="960" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="34" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="800">Flash-GMM: Turning Diagonal Gaussian Log-Densities into a Single Tiled GEMM</text>
  <text x="480" y="54" text-anchor="middle" fill="#475569" font-size="11.5">Eliminating the O(B x k) HBM distance/responsibility bottleneck via 2d-augmented matrix multiplication + streaming LogSumExp</text>

  <!-- Left: Naive Quadratic Form -->
  <rect x="26" y="76" width="285" height="328" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="26" y="76" width="285" height="34" rx="10" fill="#991b1b"/>
  <text x="168" y="98" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Naive E-Step (HBM Memory Wall)</text>
  <text x="42" y="132" fill="#1e293b" font-size="10.5" font-weight="600">Materializes (B, k, d) or (B, k):</text>
  <text x="42" y="156" fill="#7f1d1d" font-size="10.2" font-family="Consolas, monospace">diff = x[:,None,:] - mu[None,:,:]</text>
  <text x="42" y="176" fill="#7f1d1d" font-size="10.2" font-family="Consolas, monospace">maha = sum(diff^2 / var, -1)</text>
  <rect x="42" y="196" width="253" height="84" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="168" y="216" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="700">At B = 262,144, k = 65,536, d = 128:</text>
  <text x="168" y="236" text-anchor="middle" fill="#7f1d1d" font-size="10">diff tensor = 8.8 TB (impossible!)</text>
  <text x="168" y="254" text-anchor="middle" fill="#7f1d1d" font-size="10">B x k matrix = 68.7 GB FP32 HBM</text>
  <text x="168" y="271" text-anchor="middle" fill="#7f1d1d" font-size="10">Bandwidth-bound elementwise ops</text>
  <text x="42" y="310" fill="#334155" font-size="10.2">Cannot use Tensor Cores directly</text>
  <text x="42" y="330" fill="#334155" font-size="10.2">on elementwise subtraction (x - mu)^2.</text>
  <text x="42" y="358" fill="#991b1b" font-size="10.2" font-weight="700">Status: OOM or &gt;10x slower</text>

  <line x1="316" y1="240" x2="350" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrSky)"/>

  <!-- Middle: Algebraic Expansion -->
  <rect x="354" y="76" width="295" height="328" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <rect x="354" y="76" width="295" height="34" rx="10" fill="#1e3a8a"/>
  <text x="501" y="98" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">2d-Augmented GEMM Identity</text>
  <text x="368" y="130" fill="#1e293b" font-size="10.5" font-weight="700">Expand log N(x_i | mu_j, diag(var_j)):</text>
  <rect x="368" y="142" width="267" height="90" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="378" y="162" fill="#1e3a8a" font-size="10" font-family="Consolas, monospace">-0.5 * sum_m (x_im^2 / var_jm)</text>
  <text x="378" y="182" fill="#047857" font-size="10" font-family="Consolas, monospace" font-weight="700">+ sum_m x_im * (mu_jm / var_jm)</text>
  <text x="378" y="202" fill="#475569" font-size="10" font-family="Consolas, monospace">-0.5 * c_j + log(pi_j)</text>
  <text x="378" y="222" fill="#475569" font-size="9.3">c_j = sum_m(mu^2/var + ln(2*pi*var))</text>

  <text x="368" y="256" fill="#0f172a" font-size="10.5" font-weight="700">Pack 2d Feature &amp; Precision Matrices:</text>
  <rect x="368" y="268" width="267" height="72" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="378" y="288" fill="#0f172a" font-size="10" font-family="Consolas, monospace">X_aug = [ x_i^2 ,   x_i ]  (B x 2d)</text>
  <text x="378" y="308" fill="#0f172a" font-size="10" font-family="Consolas, monospace">W_aug = [-0.5/var, mu/var] (k x 2d)</text>
  <text x="378" y="328" fill="#1d4ed8" font-size="10" font-family="Consolas, monospace" font-weight="700">logits = X_aug @ W_aug^T + b_j</text>

  <text x="501" y="366" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="700">100% Tensor-Core Friendly MatMul!</text>
  <text x="501" y="384" text-anchor="middle" fill="#475569" font-size="9.8">(Zero division inside inner k-loop)</text>

  <line x1="653" y1="240" x2="687" y2="240" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrMint)"/>

  <!-- Right: Tiled SRAM + Top-m M-Step -->
  <rect x="691" y="76" width="244" height="328" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <rect x="691" y="76" width="244" height="34" rx="10" fill="#065f46"/>
  <text x="813" y="98" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Tiled SRAM + Top-m M-Step</text>

  <rect x="706" y="126" width="214" height="78" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="813" y="145" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="700">Pass 1: Streaming LogSumExp</text>
  <text x="716" y="164" fill="#1e293b" font-size="9.8">Tile over k-chunks in SRAM:</text>
  <text x="716" y="180" fill="#1e293b" font-size="9.8">Keep running (max_i, lse_i)</text>
  <text x="716" y="196" fill="#047857" font-size="9.5" font-weight="700">+ optional Top-m heap (m in 4..16)</text>

  <rect x="706" y="218" width="214" height="86" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="813" y="237" text-anchor="middle" fill="#1e3a8a" font-size="10.5" font-weight="700">Pass 2: Sparse M-Step</text>
  <text x="716" y="256" fill="#1e293b" font-size="9.8">99.9% mass in Top-m Gaussians</text>
  <text x="716" y="273" fill="#1e293b" font-size="9.8">Scatter-add r_ij, r_ij*x, r_ij*x^2</text>
  <text x="716" y="290" fill="#1d4ed8" font-size="9.8" font-weight="700">Cost: O(B*m*d) vs O(B*k*d)!</text>

  <rect x="706" y="318" width="214" height="68" rx="6" fill="#fefce8" stroke="#fde047"/>
  <text x="813" y="337" text-anchor="middle" fill="#854d0e" font-size="10.5" font-weight="700">Precision Split Rule</text>
  <text x="813" y="355" text-anchor="middle" fill="#713f12" font-size="9.5">E-step: BF16/FP32 GEMM</text>
  <text x="813" y="372" text-anchor="middle" fill="#713f12" font-size="9.5">3-Tuple (N, S, Q): Strictly FP32</text>
</svg>
