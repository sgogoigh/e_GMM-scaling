<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrEmerald" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="34" text-anchor="middle" fill="#0f172a" font-size="17" font-weight="800">Spectral Component Splitting Along Principal Eigenvector v₁</text>
  <text x="480" y="54" text-anchor="middle" fill="#475569" font-size="11.5">Reviving collapsed Gaussians by splitting high-weight donors along maximum variance with exact second-moment consistency</text>

  <!-- Left Panel: Before Split -->
  <rect x="28" y="76" width="380" height="336" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="28" y="76" width="380" height="34" rx="10" fill="#1e293b"/>
  <text x="218" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Before Split: Elongated Donor + Starved Slot</text>

  <!-- Donor Ellipse -->
  <ellipse cx="218" cy="200" rx="126" ry="42" transform="rotate(-18 218 200)" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <line x1="98" y1="239" x2="338" y2="161" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5,3"/>
  <circle cx="218" cy="200" r="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="218" y="138" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="700">Donor j* (High Mass N_j*, Elongated)</text>
  <text x="292" y="156" fill="#b45309" font-size="10.5" font-weight="700">v₁ (lam_max)</text>

  <!-- Dead Slot -->
  <rect x="48" y="284" width="340" height="108" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="218" y="306" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">Collapsed / Dead Component j_dead</text>
  <text x="64" y="326" fill="#7f1d1d" font-size="10.2">Trigger (t mod 5 == 0): N_dead &lt; tau * mean(N)</text>
  <text x="64" y="344" fill="#7f1d1d" font-size="10.2">Or rank-starved: Sigma_dead pinned to lambda_0 * I_d</text>
  <text x="64" y="362" fill="#475569" font-size="10">Power Iter (Full): 5 steps v &lt;- Sigma_j* v / ||Sigma_j* v||</text>
  <text x="64" y="379" fill="#475569" font-size="10">Diag Cov: O(d) argmax_m sigma_{j*,m}^2 directly</text>

  <!-- Center Arrow -->
  <line x1="414" y1="236" x2="520" y2="236" stroke="#10b981" stroke-width="3" marker-end="url(#arrEmerald)"/>
  <rect x="415" y="158" width="104" height="66" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="467" y="177" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="800">SPECTRAL SPLIT</text>
  <text x="467" y="194" text-anchor="middle" fill="#047857" font-size="9.5">P(j*) ~ N_j*</text>
  <text x="467" y="210" text-anchor="middle" fill="#047857" font-size="9.5">s = sqrt(lam_max)</text>

  <!-- Right Panel: After Split -->
  <rect x="528" y="76" width="404" height="336" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
  <rect x="528" y="76" width="404" height="34" rx="10" fill="#065f46"/>
  <text x="730" y="98" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">After Split: Two Compact Balanced Gaussians</text>

  <!-- Child Ellipses -->
  <ellipse cx="660" cy="212" rx="62" ry="38" transform="rotate(-18 660 212)" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <ellipse cx="798" cy="166" rx="62" ry="38" transform="rotate(-18 798 166)" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <line x1="660" y1="212" x2="798" y2="166" stroke="#d97706" stroke-width="1.8" stroke-dasharray="4,3"/>
  <circle cx="660" cy="212" r="5" fill="#059669" stroke="#fff"/>
  <circle cx="798" cy="166" r="5" fill="#db2777" stroke="#fff"/>
  <text x="640" y="264" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="700">child- (mu - delta*s*v1)</text>
  <text x="820" y="128" text-anchor="middle" fill="#9d174d" font-size="10.5" font-weight="700">child+ (mu + delta*s*v1)</text>

  <!-- Exact Equations Box -->
  <rect x="546" y="280" width="368" height="114" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="730" y="300" text-anchor="middle" fill="#065f46" font-size="11.5" font-weight="700">Exact Second-Moment &amp; Variance Identity</text>
  <text x="560" y="320" fill="#1e293b" font-size="10" font-family="Consolas, monospace">N_child+ = N_child- = 0.5 * N_j*</text>
  <text x="560" y="338" fill="#1e293b" font-size="10" font-family="Consolas, monospace">Sigma_child = Sigma_j* - delta^2 * lam_max * v1 v1^T</text>
  <text x="560" y="356" fill="#065f46" font-size="10" font-family="Consolas, monospace" font-weight="700">Q_child+/- = N_child * (Sigma_child + mu+/- mu+/-^T)</text>
  <text x="560" y="378" fill="#334155" font-size="9.6">Law of Total Covariance: 0.5(Sigma_c+ + Sigma_c-) + delta^2*lam_max v1v1^T = Sigma_j*</text>
</svg>
