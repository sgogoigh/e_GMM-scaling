[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e-gmm-scaling"
version = "0.1.0"
description = "Scaling Gaussian Mixture Models to billion-scale datasets via 3-tuple Exponential Moving Averages, Flash-GMM kernels, dimension-aware scaling laws, and spectral component splitting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.3.0",
]
triton = [
    "torch>=2.3.0",
    "triton>=3.0.0",
]
baselines = [
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
